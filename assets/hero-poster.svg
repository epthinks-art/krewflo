<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="1080" height="1920" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect width="360" height="640" fill="#F6F4EF"/>
  <!-- header -->
  <rect width="360" height="92" fill="#FFFFFF"/>
  <rect y="92" width="360" height="1" fill="#E3DFD6"/>
  <circle cx="34" cy="62" r="14" fill="#111C24"/>
  <circle cx="28" cy="62" r="2" fill="#F6F4EF"/><circle cx="34" cy="62" r="2" fill="#F6F4EF"/><circle cx="40" cy="62" r="2" fill="#E07A4A"/>
  <text x="56" y="59" font-size="15" font-weight="700" fill="#111C24">Krewflo</text>
  <text x="56" y="75" font-size="11" fill="#1D6A55">● Online</text>
  <rect x="270" y="50" width="70" height="22" rx="11" fill="#F8E7DD"/>
  <text x="305" y="65" font-size="10" font-weight="700" fill="#8A3713" text-anchor="middle" letter-spacing="1">EXAMPLE</text>
