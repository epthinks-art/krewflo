  <rect x="96" y="114" width="246" height="56" rx="16" fill="#B94A1B"/>
  <text x="112" y="138" font-size="13" fill="#FFFFFF">Build the report from my</text>
  <text x="112" y="157" font-size="13" fill="#FFFFFF">latest inspection</text>
  <!-- bot report summary -->
  <rect x="18" y="186" width="270" height="196" rx="16" fill="#FFFFFF" stroke="#E3DFD6"/>
  <text x="34" y="210" font-size="10" fill="#5E6A73" letter-spacing="1">INSPECTION REPORT · DRAFT</text>
  <text x="34" y="232" font-size="15" font-weight="700" fill="#111C24">Chimney inspection</text>
  <text x="34" y="250" font-size="11" fill="#5E6A73">3 findings · 9 photos · 1 estimate</text>
  <rect x="34" y="262" width="238" height="1" fill="#EEEAE2"/>
  <circle cx="40" cy="282" r="4" fill="#B94A1B"/><text x="52" y="286" font-size="12" fill="#3A4650">Damaged chimney flashing</text>
  <circle cx="40" cy="304" r="4" fill="#B94A1B"/><text x="52" y="308" font-size="12" fill="#3A4650">Cracked crown</text>
  <circle cx="40" cy="326" r="4" fill="#C9A54A"/><text x="52" y="330" font-size="12" fill="#3A4650">Missing rain cap</text>
  <rect x="34" y="342" width="238" height="28" rx="8" fill="#F6F4EF"/>
  <text x="44" y="360" font-size="11" fill="#3A4650">Estimated total</text>
  <text x="262" y="361" font-size="14" font-weight="700" fill="#111C24" text-anchor="end">$2,400</text>
  <!-- user ok -->
  <rect x="236" y="398" width="106" height="38" rx="16" fill="#B94A1B"/>
  <text x="289" y="422" font-size="13" fill="#FFFFFF" text-anchor="middle">Looks good</text>
  <!-- ready -->
  <rect x="18" y="452" width="270" height="118" rx="16" fill="#111C24"/>
  <text x="34" y="476" font-size="10" fill="#E9A27F" letter-spacing="1">READY TO SEND</text>
  <rect x="34" y="488" width="238" height="32" rx="8" fill="#1A2A33" stroke="#2C3A44"/>
  <rect x="44" y="496" width="22" height="16" rx="3" fill="#B94A1B"/><text x="55" y="508" font-size="7" font-weight="700" fill="#fff" text-anchor="middle">PDF</text>
  <text x="74" y="509" font-size="12" fill="#F6F4EF">Inspection-Report.pdf</text>
  <rect x="34" y="528" width="238" height="32" rx="8" fill="#1A2A33" stroke="#2C3A44"/>
  <rect x="44" y="536" width="22" height="16" rx="3" fill="#1D6A55"/><text x="55" y="548" font-size="9" fill="#fff" text-anchor="middle">✉</text>
  <text x="74" y="549" font-size="12" fill="#F6F4EF">Email draft to customer</text>
