  <rect x="18" y="590" width="324" height="34" rx="17" fill="#FFFFFF" stroke="#E3DFD6"/>
  <text x="36" y="611" font-size="12" fill="#9AA3A9">Message Krewflo…</text>
  <circle cx="324" cy="607" r="12" fill="#B94A1B"/><path d="M319 607h9m-4-4l4 4-4 4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
